<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ❤️</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="background">

        <div class="stars"></div>

        <div class="hearts"></div>

    </div>

    <div class="login-card">

        <h1>Happy Birthday</h1>
        <h2> ကိုကို့ သဲသဲ လေး ရေ ....</h2>

        <p>

            ကိုကို့ ရဲ့ BIRTHDAY Website လေးကနေ ကြိုဆို ပါတယ်။ ❤️

        </p>

        <input

               id="birthday"

               type="date">

        <button id="loginBtn">

            မွေးနေ့ရက်လေး ကို ရွေးချယ်ပြီး ဖွင့် လိုက်ပါ။ ❤️

        </button>

        <p id="error"></p>

    </div>

<script src="script.js"></script>

</body>

</html>
