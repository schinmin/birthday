<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ❤️</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b0e1a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== WELCOME PAGE ===== */
        .welcome-page {
            position: relative;
            width: 100%;
            max-width: 900px;
            min-height: 600px;
            border-radius: 60px;
            overflow: hidden;
            background: linear-gradient(145deg, #1a1f35, #0d1123);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 200, 230, 0.1);
            display: flex;
            align-items: center;
            padding: 40px 50px;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* ===== LEFT CONTENT ===== */
        .content {
            flex: 1;
            min-width: 280px;
            z-index: 2;
            position: relative;
        }

        .small {
            color: #f7b0d0;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .title {
            font-size: 3.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f9d0e3, #ffb3d1, #fce6f0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .typing {
            color: #d4b8c8;
            font-size: 1.1rem;
            font-weight: 300;
            border-right: 3px solid #ff99c8;
            padding-right: 8px;
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            animation: typing 3s steps(40) 1s forwards, blink 0.8s step-end infinite;
            width: 0;
            max-width: 100%;
        }

        @keyframes typing {
            from {
                width: 0;
            }
            to {
                width: 100%;
            }
        }

        @keyframes blink {
            0%,
            100% {
                border-color: #ff99c8;
            }
            50% {
                border-color: transparent;
            }
        }

        #continueBtn {
            margin-top: 30px;
            padding: 14px 44px;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #f7a6c9, #e87aaa);
            color: #1a1a2e;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 8px 24px rgba(255, 120, 180, 0.3);
        }

        #continueBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 32px rgba(255, 120, 180, 0.5);
        }

        /* ===== RIGHT PHOTO SLIDESHOW ===== */
        .photo-slideshow {
            flex: 1;
            min-width: 200px;
            max-width: 340px;
            height: 340px;
            border-radius: 40px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 200, 230, 0.15);
        }

        .slideshow-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            border-radius: 40px;
            overflow: hidden;
        }

        .slide.active {
            opacity: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ===== FLOATING HEARTS ANIMATION (overlay) ===== */
        .hearts-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
            border-radius: 40px;
        }

        .heart-float {
            position: absolute;
            font-size: 1.5rem;
            color: #ff77aa;
            animation: floatHeart 6s infinite ease-in-out;
            opacity: 0.7;
            text-shadow: 0 0 20px rgba(255, 100, 150, 0.4);
        }

        .heart-float:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
            font-size: 1.8rem;
        }
        .heart-float:nth-child(2) {
            left: 30%;
            animation-delay: 1.2s;
            font-size: 1.2rem;
        }
        .heart-float:nth-child(3) {
            left: 55%;
            animation-delay: 2.5s;
            font-size: 2rem;
        }
        .heart-float:nth-child(4) {
            left: 75%;
            animation-delay: 0.8s;
            font-size: 1.4rem;
        }
        .heart-float:nth-child(5) {
            left: 88%;
            animation-delay: 3.2s;
            font-size: 1.6rem;
        }
        .heart-float:nth-child(6) {
            left: 45%;
            animation-delay: 4s;
            font-size: 1rem;
        }
        .heart-float:nth-child(7) {
            left: 20%;
            animation-delay: 5s;
            font-size: 2.2rem;
        }
        .heart-float:nth-child(8) {
            left: 68%;
            animation-delay: 1.8s;
            font-size: 1.3rem;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(20px) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.9;
            }
            80% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-320px) scale(1.2) rotate(20deg);
                opacity: 0;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .welcome-page {
                flex-direction: column;
                padding: 30px 24px;
                text-align: center;
                min-height: auto;
            }
            .title {
                font-size: 2.4rem;
            }
            .photo-slideshow {
                max-width: 100%;
                height: 280px;
                width: 100%;
            }
            .typing {
                white-space: normal;
                animation: none;
                border-right: none;
                width: 100%;
            }
            .hearts-overlay .heart-float {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="welcome-page">

        <!-- ===== LEFT: TEXT CONTENT ===== -->
        <div class="content">
            <h3 class="small">🎉 Today Is Your Day 🎉</h3>
            <h1 class="title">
                Happy Birthday
                <br>
                My Princess ❤️
            </h1>
            <p class="typing">
                သဲသဲ လေးရဲ့ မွေးနေ့ လေးမှာ ပျော်ရွှင်ပါစေနော်။ ❤️
            </p>
            <button id="continueBtn">Continue 🎂</button>
        </div>

        <!-- ===== RIGHT: PHOTO SLIDESHOW ===== -->
        <div class="photo-slideshow">

            <div class="slideshow-container" id="slideshow">

                <!-- SLIDE 1 -->
                <div class="slide active">
                    <img src="images/t1.jpg" alt="Photo 1">
                </div>
                <!-- SLIDE 2 -->
                <div class="slide">
                    <img src="images/t2.jpg" alt="Photo 2">
                </div>
                <!-- SLIDE 3 -->
                <div class="slide">
                    <img src="images/t3.jpg" alt="Photo 3">
                </div>
                <!-- SLIDE 4 -->
                <div class="slide">
                    <img src="images/t4.jpg" alt="Photo 4">
                </div>
                <!-- SLIDE 5 -->
                <div class="slide">
                    <img src="images/t5.jpg" alt="Photo 5">
                </div>

            </div>

            <!-- ===== FLOATING HEARTS OVERLAY ===== -->
            <div class="hearts-overlay">
                <span class="heart-float">❤️</span>
                <span class="heart-float">💕</span>
                <span class="heart-float">💖</span>
                <span class="heart-float">❤️</span>
                <span class="heart-float">💗</span>
                <span class="heart-float">❤️</span>
                <span class="heart-float">💖</span>
                <span class="heart-float">💕</span>
            </div>

        </div>

    </div>

    <script>
        // ===== CONTINUE BUTTON =====
        document.getElementById("continueBtn").onclick = function() {
            window.location = "cake.html";
        }

        // ===== SLIDESHOW AUTOPLAY =====
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;

        function nextSlide() {
            // remove active from current
            slides[currentSlide].classList.remove('active');
            // move to next
            currentSlide = (currentSlide + 1) % totalSlides;
            // add active to new
            slides[currentSlide].classList.add('active');
        }

        // change slide every 4 seconds
        setInterval(nextSlide, 4000);
    </script>

</body>

</html>
